in:5px 0 0}.select{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:8px;color:#647168;font-size:10px}.chart{height:195px;position:relative;padding:8px 0 22px 35px}.chart svg{width:100%;height:100%;overflow:visible}.axis{position:absolute;left:0;top:3px;bottom:25px;display:flex;flex-direction:column;justify-content:space-between;color:#a1aaa4;font-size:9px}.months{position:absolute;bottom:0;left:35px;right:0;display:flex;justify-content:space-between;color:#a1aaa4;font-size:9px}.legend{display:flex;gap:18px;font-size:10px;color:var(--muted);margin-top:4px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}.dot.gray{background:#cbd9a3}.allocation{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:17px;padding:3px 6px 8px}.donut{width:145px;height:145px;border-radius:50%;background:conic-gradient(#176b50 0 38%,#a8c27d 38% 63%,#e7c889 63% 80%,#b9c8d0 80% 92%,#e8ece6 92%);display:grid;place-items:center}.donut:after{content:'R$ 2,4 mi';width:96px;height:96px;background:#fff;border-radius:50%;display:grid;place-items:center;font:700 14px Manrope}.alloc-list{display:grid;gap:12px}.alloc-row{display:flex;justify-content:space-between;font-size:10px;color:#627067}.alloc-row span:first-child:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:7px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:9px;color:#9aa49e;text-transform:uppercase;letter-spacing:.8px;padding:0 10px 11px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #f0f2ed;font-size:11px;color:#59685f}td:first-child{font-weight:700;color:var(--ink)}.pill{border-radius:20px;padding:5px 8px;background:#edf5e9;color:var(--green);font-size:9px;font-weight:700;white-space:nowrap}.pill.warn{background:#fff3e2;color:#a76a22}.bottom-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:17px}.agenda-item{display:flex;gap:13px;padding:12px 0;border-bottom:1px solid #f0f2ed}.datebox{width:43px;height:45px;background:#f1f5ed;border-radius:10px;display:grid;place-content:center;text-align:center;color:var(--green);font-weight:700}.datebox small{font-size:9px;text-transform:uppercase}.agenda-item b{font-size:11px}.agenda-item p{margin:4px 0;color:var(--muted);font-size:10px}.goal{padding:14px 0;border-bottom:1px solid #f0f2ed}.goal-head{display:flex;justify-content:space-between;font-size:11px}.goal-head span{color:var(--muted)}.progress{height:6px;border-radius:8px;background:#edf0ea;margin-top:10px;overflow:hidden}.progress i{height:100%;display:block;background:var(--green);border-radius:8px}.alert{border-radius:12px;background:#fff7e9;padding:12px 13px;color:#845d2c;font-size:10px;line-height:1.5;margin-top:14px}.section-panel{padding:20px;margin-bottom:17px}.filters{display:flex;gap:8px;margin-bottom:18px}.filter{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;font-size:10px;color:#69776e}.filter.active{background:#edf4ec;color:var(--green);border-color:#dce8d8;font-weight:700}.profile-hero{display:flex;gap:20px;align-items:center;padding:23px}.profile-hero .avatar{width:70px;height:70px;font-size:21px}.profile-hero h2{font:700 18px Manrope;margin:0 0 5px}.profile-hero p{color:var(--muted);margin:0;font-size:12px}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{padding:12px;border:1px solid var(--line);border-radius:10px}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:6px}.field b{font-size:11px}.role-select{display:flex;gap:8px;background:#f5f7f2;padding:4px;border-radius:10px}.role-select button{padding:8px 12px;border-radius:7px;font-size:10px;background:transparent;color:var(--muted)}.role-select button.active{background:#fff;color:var(--green);font-weight:700;box-shadow:0 2px 8px #14251f0d}.toast{position:fixed;bottom:24px;right:25px;background:#163e2e;color:#fff;pad :root{--ink:#111;--muted:#737373;--green:#111;--lime:#c8ff00;--bg:#f5f5f3;--line:#e5e5e2;--white:#fff;--soft:#f1f1ed;--shadow:0 3px 14px #00000008;--orange:#c98a27;--red:#c84b43}

.sidebar{border-color:#e6e6e3;padding:24px 15px}.brand{font:800 19px Manrope;letter-spacing:-.7px}.brand-mark{background:#111;color:var(--lime);border-radius:8px}.brand small{letter-spacing:1.15px}.group-label{font-size:9px;letter-spacing:1.15px;color:#8b8b87}.nav{border-radius:7px;padding:10px 11px;color:#555}.nav:hover,.nav.active{background:#f0f0eb;color:#111;font-weight:700}.nav.active:before{content:'';width:3px;height:19px;background:var(--lime);border-radius:2px;margin-left:-11px;margin-right:2px}.nav .ico{font-size:15px}.advisor-card{background:#f3f3ef;border-radius:9px}.small-btn{border-radius:6px;color:#111;font-weight:700}.avatar{border-radius:8px;background:#e7e7e1;color:#222}.topbar{box-shadow:0 1px 0 #00000005}.icon-btn{background:#f2f2ef;border-radius:8px;color:#222}.page{max-width:1480px}.eyebrow{color:#777;letter-spacing:1.25px}.heading h1{font-family:Manrope;font-size:26px;letter-spacing:-1px}.heading p{color:#72726f}.button{background:#111;color:#fff;border-radius:7px;padding:11px 15px}.button:hover{background:#303030}.button.lime{background:var(--lime);color:#111}.button.light{border-radius:7px}.card{border:1px solid #e6e6e3;border-radius:10px;box-shadow:var(--shadow)}.stat{padding:17px 18px}.stat-icon{background:#f2f2ee;color:#111;border-radius:7px}.stat strong{font-size:22px;letter-spacing:-.8px}.positive{color:#343434}.subtle{color:#8a8a86}.panel{padding:19px}.panel h2{font-size:13px;letter-spacing:-.15px}.select,.filter{border-radius:6px;background:#fff;border-color:#e4e4e0;color:#555}.filter.active{background:#111;color:#fff;border-color:#111}.donut{background:conic-gradient(#111 0 38%,#c8ff00 38% 63%,#a5a59e 63% 80%,#d3d3cc 80% 92%,#ecece8 92%)}.dot{background:#111}.dot.gray{background:#c8ff00}.pill{background:#efefea;color:#333;border-radius:5px}.pill.warn{background:#fff2d8;color:#855719}.datebox{background:#f0f0eb;color:#222;border-radius:7px}.alert{border-radius:8px}.goal,.agenda-item{border-color:#ecece8}.progress{background:#ecece8;border-radius:3px}.progress i{background:#111;border-radius:3px}.role-select{background:#f1f1ed;border-radius:7px}.role-select button{border-radius:5px}.role-select button.active{color:#111}.field{border-radius:7px}.profile-hero .avatar{border-radius:12px}

</style></head><body><div id="app"></div><div id="toast" class="toast">Alterações salvas no protótipo</div>
<script>
const icons={Dashboard:'▦',Carteira:'◈',Investimentos:'↗',Métricas:'⌁',Medicamentos:'✚',Clientes:'♙',Perfil:'◎',"Invest. imobiliários":'⌂',"Prospecção / Benchmark de clientes":'⌕'};
let role='assessor', page='Dashboard';
const navItem=(name,group='')=>`<button class="nav ${page===name?'active':''}" onclick="go('${name}')"><span class="ico">${icons[name]||'•'}</span>${name}</button>`;
function sidebar(){return `<aside class="sidebar" id="sidebar"><div class="brand"><span class="brand-mark">x</span><span>XPremium<small>WEALTH MANAGEMENT</small></span></div><div class="group-label">Visão geral</div>${navItem('Dashboard')}${navItem('Carteira')}${navItem('Investimentos')}${navItem('Métricas')}${navItem('Medicamentos')}<div class="group-label" style="margin-top:14px">Relacionamento</div>${navItem('Clientes')}${navItem('Perfil')}${navItem('Invest. imobiliários')}<div class="group-label" style="margin-top:14px">Expansão</div>${navItem('Prospecção / Benchmark de clientes')}<div class="side-bottom"><div class="advisor-card"><b>Precisa de ajuda?</b><p>Seu assessor está disponível para apoiar suas decisões.</p><button class="small-btn" onclick="toast('Solicitação enviada ao assessor')">Falar com assessor ↗</button></div><div class="userrow"><div class="avatar">${role==='assessor'?'MC':'AM'}</div><div><b>${role==='assessor'?'Mariana Costa':'Ana Martins'}</b><small>${role==='assessor'?'Assessora private':'Cliente private'}</small></div><span style="margin-left:auto;color:#88958d">⌄</span></div></div></aside>`}
function topbar(){return `<header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="icon-btn mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="crumb">Workspace&nbsp; / &nbsp;<strong>${page}</strong></div></div><div class="top-actions"><div class="role-select"><button class="${role==='assessor'?'active':''}" onclick="setRole('assessor')">Assessor</button><button class="${role==='cliente'?'active':''}" onclick="setRole('cliente')">Cliente</button></div><button class="icon-btn" onclick="toast('Você está em dia com as notificações')">♧</button><div class="avatar" style="width:32px;height:32px;font-size:11px">${role==='assessor'?'MC':'AM'}</div></div></header>`}
const heading=(eyebrow,title,desc,btn='')=>`<div class="heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${btn?`<button class="button" onclick="toast('${btn[1]}')">${btn[0]}</button>`:''}</div>`;
const stat=(label,value,delta,icon)=>`<div class="card stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${icon}</span></div><strong>${value}</strong><div class="positive">↗ ${delta} <span class="subtle">vs. mês anterior</span></div></div>`;
function chart(){return `<div class="chart"><div class="axis"><span>2,5 mi</span><span>2,0 mi</span><span>1,5 mi</span><span>1,0 mi</span></div><svg viewBox="0 0 600 170" preserveAspectRatio="none"><defs><linearGradient id="shade" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#176b50" stop-opacity=".17"/><stop offset="1" stop-color="#176b50" stop-opacity="0"/></linearGradient></defs><path d="M0 135 C35 128 43 118 72 122 S112 104 145 110 S183 81 218 94 S260 77 290 83 S330 58 360 69 S400 46 435 57 S477 28 510 45 S555 16 600 21 L600 170 L0 170Z" fill="url(#shade)"/><path d="M0 135 C35 128 43 118 72 122 S112 104 145 110 S183 81 218 94 S260 77 290 83 S330 58 360 69 S400 46 435 57 S477 28 510 45 S555 16 600 21" fill="none" stroke="#176b50" stroke-width="3" stroke-linecap="round"/><path d="M0 147 C40 142 48 135 80 138 S125 125 160 133 S205 115 240 120 S280 104 320 111 S365 100 405 106 S455 90 490 97 S550 78 600 83" fill="none" stroke="#b7cd91" stroke-width="2" stroke-dasharray="5 5"/></svg><div class="months"><span>Mai</span><span>Jun</span><span>Jul</span><span>Ago</span><span>Set</span><span>Out</span><span>Nov</span><span>Dez</span></div></div><div class="legend"><span><i class="dot"></i>Patrimônio total</span><span><i class="dot gray"></i>Meta projetada</span></div>`}
function portfolio(){return `<div class="allocation"><div class="donut"></div><div class="alloc-list">${[['Renda fixa','38%','#176b50'],['Fundos','25%','#a8c27d'],['Ações','17%','#e7c889'],['Exterior','12%','#b9c8d0'],['Outros','8%','#e8ece6']].map(x=>`<div class="alloc-row"><span style="--c:${x[2]}">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div>`}
const rows=[['Tesouro IPCA+ 2029','Renda fixa','R$ 420.500','11,2%','Ativo'],['CDB Banco XP · 2027','Renda fixa','R$ 315.000','10,8%','Ativo'],['Fundo Atlas Macro','Multimercado','R$ 286.400','8,4%','Ativo'],['IVVB11','Exterior','R$ 198.250','14,6%','Ativo'],['Debênture incentivada','Crédito privado','R$ 172.800','9,1%','Vence em 42d']];
function table(data=rows){return `<div class="table-wrap"><table><thead><tr><th>Ativo</th><th>Classe</th><th>Posição</th><th>Rentabilidade</th><th>Status</th></tr></thead><tbody>${data.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${r[3].startsWith('-')?'':'positive'}">${r[3]}</td><td><span class="pill ${i===4?'warn':''}">${r[4]}</span></td></tr>`).join('')}</tbody></table></div>`}
function dashboard(){let client=role==='cliente';return `${heading(client?'ÁREA DO CLIENTE':'VISÃO DO ASSESSOR',client?'Olá, Ana 👋':'Bom dia, Mariana 👋',client?'Acompanhe seu patrimônio e seus investimentos.':'Aqui está o resumo da sua carteira de clientes.', ['＋ Nova análise', 'Nova análise criada'])}<div class="stats">${stat('Patrimônio sob gestão',client?'R$ 2.418.650':'R$ 48,6 mi',client?'8,4%':'12,8%','◈')}${stat(client?'Rentabilidade no ano':'Clientes ativos',client?'12,8%':'24','2,1%','↗')}${stat('Renda mensal estimada',client?'R$ 18.420':'R$ 684 mil','6,3%','▤')}${stat('Oportunidades em aberto',client?'3':'12','2 novas','✧')}</div><div class="grid"><section class="card panel"><div class="panel-head"><div><h2>Evolução patrimonial</h2><p>Patrimônio consolidado ao longo do tempo</p></div><button class="select">Últimos 8 meses⌄</button></div>${chart()}</section><section class="card panel"><div class="panel-head"><div><h2>Alocação da carteira</h2><p>Distribuição por classe de ativo</p></div><button class="select" onclick="go('Carteira')">Ver carteira ↗</button></div>${portfolio()}</section></div><div class="grid"><section class="card panel"><div class="panel-head"><div><h2>${client?'Seus investimentos':'Investimentos em destaque'}</h2><p>Posições com melhor acompanhamento</p></div><button class="select" onclick="go('Investimentos')">Ver todos ↗</button></div>${table(rows.slice(0,4))}</section><section class="card panel"><div class="panel-head"><div><h2>Próximos compromissos</h2><p>Agenda da semana</p></div><button class="select" onclick="toast('Agenda completa aberta')">Ver agenda</button></div><div class="agenda-item"><div class="datebox"><small>OUT</small>14</div><div><b>Revisão de carteira</b><p>10:30 · Ana Martins · Reunião online</p></div></div><div class="agenda-item"><div class="datebox"><small>OUT</small>16</div><div><b>Vencimento de aplicação</b><p>14:00 · CDB Banco XP · R$ 85.000</p></div></div></section></div><div class="bottom-grid"><section class="card panel"><div class="panel-head"><div><h2>Metas financeiras</h2><p>Progresso das metas em andamento</p></div><button class="select" onclick="go('Métricas')">Ver métricas ↗</button></div>${[['Reserva de oportunidade','R$ 380 mil de R$ 500 mil','76%'],['Renda passiva mensal','R$ 18,4 mil de R$ 25 mil','74%'],['Diversificação internacional','R$ 290 mil de R$ 400 mil','73%']].map(g=>`<div class="goal"><div class="goal-head"><b>${g[0]}</b><span>${g[1]}</span></div><div class="progress"><i style="width:${g[2]}"></i></div></div>`).join('')}</section><section class="card panel"><div class="panel-head"><div><h2>Central de atenção</h2><p>Itens que precisam de acompanhamento</p></div></div><div class="alert">◷ &nbsp;<b>Debênture incentivada vence em 42 dias.</b><br>Considere revisar as opções de reinvestimento com seu assessor.</div><div class="agenda-item"><div class="datebox" style="background:#fff2e5;color:#ae752f">!</div><div><b>Perfil de investidor desatualizado</b><p>Revise suas informações para manter suas recomendações alinhadas.</p></div></div></section></div>`}

function dashboard(){return `${head(role==='Assessor'?'VISÃO DO ASSESSOR':'ÁREA DO CLIENTE',role==='Assessor'?'Bom dia, Mariana':'Olá, Ana',role==='Assessor'?'Resumo das carteiras e dos próximos compromissos.':'Acompanhe seu patrimônio e seus investimentos.',['＋ Nova análise','Nova análise criada'])}${stats([['Patrimônio sob gestão','R$ 48,6 mi','12,8%','◈'],['Clientes ativos','24','2 novos','♙'],['Rentabilidade média','12,4%','2,1%','↗'],['Oportunidades','12','3 prioritárias','✳']])}<div class="xp-cols"><section class="xp-card"><h2>Evolução patrimonial</h2><p class="desc">Patrimônio consolidado · últimos 8 meses</p>${chart()}</section><section class="xp-card"><h2>Alocação da carteira</h2><p class="desc">Distribuição por classe de ativo</p>${donut()}</section></div><div class="xp-cols"><section class="xp-card"><h2>Investimentos em destaque</h2><p class="desc">Posições com melhor acompanhamento</p>${table(investments.slice(0,4))}</section><section class="xp-card"><h2>Agenda compartilhada</h2><p class="desc">Próximos compromissos assessor ↔ cliente</p>${event('14','OUT','Revisão de carteira','10:30 · Ana Martins · Reunião online')}${event('16','OUT','Vencimento de aplicação','14:00 · CDB Banco XP · R$ 85 mil')}<button class="xp-btn outline" style="margin-top:12px" onclick="xpApp.go('Agenda')">Abrir calendário →</button></section></div>`}
function event(d,m,t,sub){return `<div class="xp-event"><div class="xp-event-date"><small>${m}</small>${d}</div><div><b>${t}</b><p>${sub}</p></div><span class="xp-tag lime">Confirmado</span></div>`}
function calendar(){let days=['D','S','T','Q','Q','S','S'],arr=Array.from({length:35},(_,i)=>i<4?'':i-3>31?'':i-3);return `${head('RELACIONAMENTO','Agenda compartilhada','Agende reuniões entre assessor e cliente, com disponibilidade e confirmação.',['＋ Novo compromisso','Formulário de agendamento aberto'])}<div class="xp-calendar"><section class="xp-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><button class="xp-btn outline" onclick="xpApp.shiftMonth(-1)">‹</button><b style="font:700 13px Manrope">${month}</b><button class="xp-btn outline" onclick="xpApp.shiftMonth(1)">›</button></div><div class="xp-cal-grid">${days.map(d=>`<div class="xp-cal-head">${d}</div>`).join('')}${arr.map(d=>`<button class="xp-day ${d===14?'today':''} ${d===selectedDay?'sel':''}" onclick="xpApp.pickDay(${d||0})">${d||''}${[8,14,16,21,26].includes(d)?'<i></i>':''}</button>`).join('')}</div></section><section class="xp-card"><h2>Compromissos · ${selectedDay} ${month.split(' ')[0]}</h2><p class="desc">Participantes recebem confirmação e lembrete.</p>${event('10:30','14','Revisão de carteira','Ana Martins + Mariana Costa')}${event('14:00','14','Planejamento patrimonial','Ana Martins + Mariana Costa')}<button class="xp-btn lime" style="margin-top:14px" onclick="xpApp.msg('Convite enviado para confirmação')">＋ Agendar reunião</button></section></div>`}
function onboarding(){let titles=['Dados pessoais','Perfil do investidor','Objetivos','Revisão e consentimento'];let body=step===1?`<div class="xp-fields">${field('Nome completo','Ex.: Ana Martins')}${field('CPF','000.000.000-00')}${field('Data de nascimento','DD/MM/AAAA')}${field('E-mail','seu@email.com','email')}${field('Celular','(11) 90000-0000')}${field('Profissão','Sua profissão')}${select('Estado civil',['Selecione','Solteiro(a)','Casado(a)','União estável','Divorciado(a)'])}${select('Renda mensal aproximada',['Selecione','Até R$ 5 mil','R$ 5 mil – R$ 15 mil','R$ 15 mil – R$ 50 mil','Acima de R$ 50 mil'])}</div>`:step===2?`<p style="font-size:11px;color:#555">Como você reage quando seus investimentos apresentam oscilações?</p><div class="xp-choice">${['Prefiro evitar perdas','Aceito oscilações moderadas','Busco maior potencial de retorno'].map(x=>`<button onclick="this.classList.toggle('chosen')">${x}</button>`).join('')}</div><div class="xp-fields" style="margin-top:18px">${select('Experiência com investimentos',['Selecione','Iniciante','Intermediária','Avançada'])}${select('Prazo principal dos investimentos',['Selecione','Até 2 anos','2 a 5 anos','Acima de 5 anos'])}${select('Percentual do patrimônio investível',['Selecione','Até 25%','25% a 50%','Mais de 50%'])}${select('Conhece produtos de risco?',['Selecione','Ainda não','Alguns','Sim, com frequência'])}</div>`:step===3?`<p style="font-size:11px;color:#555">Quais objetivos você quer priorizar com sua assessoria?</p><div class="xp-choice">${['Construir reserva','Preservar patrimônio','Gerar renda passiva','Comprar imóvel','Planejar aposentadoria','Diversificar no exterior'].map(x=>`<button onclick="this.classList.toggle('chosen')">${x}</button>`).join('')}</div><div class="xp-fields" style="margin-top:18px">${field('Patrimônio investível estimado','R$')}${select('Quando pretende alcançar seus objetivos?',['Selecione','Até 2 anos','2 a 5 anos','Mais de 5 anos'])}${field('Observações para seu assessor','Conte-nos um pouco sobre suas prioridades','text',true)}</div>`:`<div class="xp-card" style="background:#f8f8f5"><h2>Confira antes de enviar</h2><p class="desc">Seus dados ajudam a personalizar o atendimento e verificar a adequação dos investimentos ao seu perfil.</p><label style="font-size:10px"><input type="checkbox"> Confirmo que as informações são verdadeiras e autorizo o uso para abertura e atendimento da minha conta, conforme a política de privacidade.</label><p style="font-size:9px;color:#888;margin-top:15px">O perfil será revisado pelo assessor e poderá ser atualizado a qualquer momento.</p></div>`;return `<div class="xp-form">${head('BOAS-VINDAS À XP PRIVATE','Vamos conhecer você','Preencha este formulário seguro para iniciar seu relacionamento com a assessoria.') }<section class="xp-card"><div class="xp-steps">${titles.map((t,i)=>`<div class="xp-step ${step===i+1?'active':''}">0${i+1} &nbsp; ${t}</div>`).join('')}</div>${body}<div class="xp-form-foot"><button class="xp-btn outline" onclick="xpApp.formBack()" ${step===1?'disabled':''}>← Voltar</button><button class="xp-btn lime" onclick="xpApp.formNext()">${step===4?'Enviar cadastro':'Continuar →'}</button></div></section></div>`}
function field(label,placeholder,type='text',full=false){return `<div class="xp-field ${full?'full':''}"><label>${label}</label><input type="${type}" placeholder="${placeholder}"></div>`}function select(label,options){return `<div class="xp-field"><label>${label}</label><select>${options.map((x,i)=>`<option ${i===0?'disabled selected':''}>${x}</option>`).join('')}</select></div>`}
function pageContent(){if(activePage==='Dashboard')return dashboard();if(activePage==='Agenda')return calendar();if(activePage==='Perfil')return onboarding();if(activePage==='Clientes')return `${head('RELACIONAMENTO','Carteira de clientes','Perfis e patrimônio dos seus clientes.',['＋ Novo cliente','Cadastro de novo cliente'])}${stats([['Clientes ativos','24','2 novos','♙'],['Patrimônio acompanhado','R$ 48,6 mi','12,8%','◈'],['Revisões pendentes','3','1 urgente','!'],['Reuniões esta semana','8','2 hoje','▦']])}<section class="xp-card"><h2>Clientes da carteira</h2><p class="desc">Acompanhamento e perfil de relacionamento</p>${table([['Ana Martins','Moderado','R$ 2.418.650','12,8%','Ativo'],['Roberto Almeida','Arrojado','R$ 1.840.200','14,2%','Ativo'],['Camila Ferreira','Conservador','R$ 980.500','9,6%','Ativo'],['Eduardo Santos','Moderado','R$ 3.125.800','11,4%','Ativo']])}</section>`;let title=activePage;return `${head('GESTÃO PATRIMONIAL',title,`Visão consolidada de ${title.toLowerCase()} e acompanhamento da carteira.`,['＋ Adicionar','Registro adicionado'])}${stats([['Patrimônio acompanhado','R$ 2,4 mi','8,4%','◈'],['Em acompanhamento','08','2 novos','◎'],['Oportunidades','12','3 prioritárias','✳'],['Atualizado em','Hoje','Agora','◷']])}<div class="xp-cols"><section class="xp-card"><h2>${title} em acompanhamento</h2><p class="desc">Posições, alocações e movimentações recentes</p>${table(investments)}</section><section class="xp-card"><h2>Alocação</h2><p class="desc">Distribuição da carteira</p>${donut()}</section></div>`}
function login(){return `<div class="xp-login"><section class="xp-login-brand"><div class="xp-login-logo"><b>XP</b><span>XPremium</span></div><div class="xp-login-copy"><small>ASSESSORIA PRIVATE · XP INC.</small><h1>Estratégias exclusivas,<br><em>resultados de alto nível.</em></h1><p>Uma experiência próxima e completa para acompanhar seus investimentos ao lado da sua assessoria.</p></div><div class="xp-login-orb"></div></section><section class="xp-login-panel"><div class="xp-login-box"><div style="font-size:9px;color:#777;letter-spacing:1px;margin-bottom:10px">ACESSO SEGURO</div><h2>Entre na sua conta</h2><p>Acesse seu espaço de gestão patrimonial.</p><div class="xp-role"><button class="${role==='Assessor'?'on':''}" onclick="xpApp.setRole('Assessor')">Sou assessor</button><button class="${role==='Cliente'?'on':''}" onclick="xpApp.setRole('Cliente')">Sou cliente</button></div><div class="xp-field"><label>E-mail ou CPF</label><input id="xp-user" placeholder="Digite seu e-mail ou CPF"></div><div class="xp-field"><label>Senha</label><input type="password" placeholder="Digite sua senha"></div><div style="text-align:right;margin:1px 0 9px"><button style="border:0;background:none;color:#555;font-size:9px;text-decoration:underline" onclick="xpApp.msg('Link de recuperação enviado')">Esqueci minha senha</button></div><button class="xp-btn lime" onclick="xpApp.login()">Entrar com segurança →</button><div class="xp-login-note">Novo cliente? <button onclick="xpApp.signup()">Comece seu cadastro</button></div><div style="text-align:center;color:#aaa;font-size:8px;margin-top:35px">🔒 &nbsp; Seus dados protegidos com segurança XP</div></div></section></div>`}
function draw(){app.innerHTML=screen==='login'?login():screen==='onboarding'?onboarding():shell(pageContent());document.querySelectorAll('.xp-menu').forEach(x=>x.style.display='grid')}
window.xpApp={msg,go,login:()=>{if(!$('#xp-user')?.value){msg('Informe seu e-mail ou CPF para continuar');return}screen='app';role=role;activePage='Dashboard';draw()},signup:()=>{screen='onboarding';step=1;activePage='Perfil';draw()},formNext:()=>{if(step<4){step++;draw()}else{msg('Cadastro enviado para análise da assessoria');screen='app';activePage='Dashboard';draw()}},formBack:()=>{if(step>1){step--;draw()}else{screen='login';draw()}},setRole:r=>{role=r;draw()},pickDay:d=>{if(d){selectedDay=d;draw()}},shiftMonth:d=>{month=d<0?'Setembro 2026':'Novembro 2026';draw()}};
draw();
})();
</script>
<style>
.xp-donut{background:conic-gradient(#fbc105 0 38%,#111 38% 63%,#858585 63% 80%,#c9c9c3 80% 92%,#ecece9 92%)}
